# Baseline = the fork as it was before plan-time prefetch and pipelined hints (same latency injection)
pinot.server.netty.port=8098
pinot.server.adminapi.port=8097
pinot.server.instance.dataDir=/tmp/pinot/server/index
pinot.server.instance.segmentTarDir=/tmp/pinot/server/segmentTar
pinot.set.instance.id.to.hostname=true
pinot.server.instance.segment.directory.loader=remote
pinot.server.query.executor.enable.prefetch=true
pinot.server.instance.remote.storage.mode=spill
pinot.server.instance.remote.promote.max.bytes=134217728
pinot.server.instance.remote.prefetch.coalesce.gap.bytes=4096
pinot.server.instance.remote.plan.prefetch.enabled=false
pinot.server.instance.remote.pipelined.hints.enabled=false
# benchmark-only: emulate object-store first-byte latency per GET against the file:// deep store
pinot.server.instance.remote.fetch.debug.latency.ms=30
pinot.server.instance.remote.prefetch.max.ranges=512
pinot.server.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.server.storage.factory.s3.region=eu-west-1
pinot.server.segment.fetcher.protocols=file,http,s3
